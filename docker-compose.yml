services:
  corporate:
    build:
      context: ./app-corporate
    container_name: example-corporate
    image: hiage/page-corporate:latest
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  customer:
