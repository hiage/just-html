services:
  demo-corporate:
    container_name: demo-corporate
    image: hiage/page-corporate:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sag-universe

